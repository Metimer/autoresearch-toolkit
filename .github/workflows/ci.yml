name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: ["1.81.0", stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the selected Rust toolchain
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --component rustfmt --component clippy
      - name: Test
        run: cargo +${{ matrix.rust }} test --workspace --locked
      - name: Formatting and lints
        if: matrix.rust == '1.81.0'
        run: |
          cargo +1.81.0 fmt --all -- --check
          cargo +1.81.0 clippy --workspace --all-targets --locked -- -D warnings

  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s tests -v

  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node --test tests/legacy/jsonl.test.mjs

  pi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: rustup toolchain install 1.81.0 --profile minimal
      - run: cargo +1.81.0 build --workspace --locked
      - run: npm --prefix adapters/pi ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix adapters/pi run check
      - run: npm --prefix adapters/pi test
