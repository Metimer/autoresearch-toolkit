[workspace]
members = ["crates/autoresearch-core", "crates/autoresearch-cli"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
authors = ["Metimer <metinamerwane@gmail.com>"]
publish = false

[workspace.dependencies]
autoresearch-core = { path = "crates/autoresearch-core" }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
fs2 = "=0.4.3"
schemars = "=0.8.22"
sha2 = "=0.10.8"
tempfile = "=3.13.0"
libc = "=0.2.159"
rustix = { version = "=0.38.37", features = ["process"] }
signal-hook = "=0.3.17"
jsonschema = { version = "=0.18.3", default-features = false }
# Keep schema-test transitive dependencies compatible with the Rust 1.81 MSRV.
url = "=2.5.2"
time = "=0.3.36"
uuid = "=1.10.0"
ahash = "=0.8.11"

[workspace.lints.rust]
unsafe_code = "forbid"
